<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>خطأ في تسجيل الدخول</title>
<meta http-equiv="refresh" content="0; url=$(link-login)?error=$(error-esc)">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<style>
html, body {
    background-color: #0f172a;
    color: #ffffff;
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}
.error-card {
    background: rgba(30, 41, 59, 0.85);
    border: 1px solid rgba(255, 127, 80, 0.4);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    max-width: 360px;
}
a {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 20px;
    background: #2563eb;
    color: #ffffff;
    text-decoration: none;
    border-radius: 10px;
}
</style>
<script type="text/javascript">
(function() {
    var target = '$(link-login)';
    if (!target || target.includes('$(')) target = 'login.html';
    var err = '$(error-esc)';
    if (err && !err.includes('$(')) {
        target += (target.indexOf('?') === -1 ? '?' : '&') + 'error=' + encodeURIComponent(err);
    }
    window.location.replace(target);
})();
</script>
</head>
<body>
<div class="error-card">
    <h3>$(error)</h3>
    <a href="$(link-login)">العودة لصفحة الدخول</a>
</div>
</body>
</html>
