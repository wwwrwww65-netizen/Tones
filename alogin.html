<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم تسجيل الدخول بنجاح</title>
    <meta http-equiv="refresh" content="2; url=$(link-status)">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #18060c;
            background: radial-gradient(circle at 50% 30%, #3a0d1b 0%, #18060c 100%);
            color: #f1f5f9;
            padding: 20px;
        }
        .success-card {
            background: rgba(36, 10, 18, 0.88);
            border: 1px solid rgba(212, 160, 23, 0.4);
            border-radius: 24px;
            padding: 36px 24px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
        }
        .icon-circle {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #d4a017, #f59e0b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 24px rgba(212, 160, 23, 0.4);
        }
        .icon-circle svg {
            width: 38px;
            height: 38px;
            fill: #18060c;
        }
        h2 {
            margin: 0 0 10px;
            color: #fef08a;
            font-size: 22px;
            font-weight: 800;
        }
        p {
            color: #cbd5e1;
            font-size: 14px;
            margin: 0 0 24px;
            line-height: 1.6;
        }
        .status-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, #881337, #9f1239);
            border: 1px solid rgba(212, 160, 23, 0.5);
            color: #fde047;
            padding: 14px 28px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(136, 19, 55, 0.4);
            transition: all 0.25s ease;
        }
        .status-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body onload="setTimeout(function(){ window.location='$(link-status)'; }, 1200);">
    <div class="success-card">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <h2>تم تسجيل الدخول بنجاح!</h2>
        <p>أهلاً بك عزيزي المشترك، جاري تحويلك لصفحة حالة الاتصال...</p>
        <a href="$(link-status)" class="status-btn">
            <span>الانتقال لصفحة الحالة</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </a>
    </div>
</body>
</html>
